apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: test-ttl-policy
  namespace: test-depod
spec:
  match:
    namespaceSelector:
      matchNames:
        - test-depod
    podSelector:
      matchLabels:
        app: test-app

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "ttl-test"

  when:
    type: "Builtin"
    ttlSeconds: 10

  then:
    type: "Delete"
    graceSeconds: 0
    dryRun: true

  limits:
    maxDeletesPerMinute: 20
    protectSystemNamespaces: true
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-1
  namespace: test-depod
  labels:
    app: test-app
  annotations:
    kube-depod/policy: "ttl-test"
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-2
  namespace: test-depod
  labels:
    app: test-app
  annotations:
    kube-depod/policy: "ttl-test"
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-3
  namespace: test-depod
  labels:
    app: test-app
  annotations:
    kube-depod/policy: "ttl-test"
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
