name: Tag on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to write commits and tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | sed 's/version = "//;s/"//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Helm Chart version
        id: update_chart
        run: |
          CHART_PATH="helm/kube-depod/Chart.yaml"
          NEW_VERSION="${{ steps.version.outputs.version }}"
          
          # Get the current version from the chart to prevent re-running
          OLD_VERSION=$(grep '^version: ' ${CHART_PATH} | sed 's/version: //')
          
          if [ "${OLD_VERSION}" = "${NEW_VERSION}" ]; then
            echo "Helm chart version is already up to date. Nothing to do."
            echo "continue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Updating Helm chart from ${OLD_VERSION} to ${NEW_VERSION}"
          # Update both version and appVersion in Chart.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" ${CHART_PATH}
          sed -i "s/^appVersion: .*/appVersion: \"${NEW_VERSION}\"/" ${CHART_PATH}
          
          # Update image.tag in values.yaml
          VALUES_PATH="helm/kube-depod/values.yaml"
          sed -i "s/^\(  tag: \)\"v.*\"/\1\"v${NEW_VERSION}\"/" ${VALUES_PATH}
          
          # Update manifests/deployment.yaml
          MANIFEST_PATH="manifests/deployment.yaml"
          sed -i "s/\(version: v\)[0-9.]*$/\1${NEW_VERSION}/" ${MANIFEST_PATH}
          sed -i "s|\(image: ghcr.io/mrchypark/kube-depod:v\)[0-9.]*$|\1${NEW_VERSION}|" ${MANIFEST_PATH}
          
          echo "continue=true" >> $GITHUB_OUTPUT

      - name: Commit and push Helm chart changes
        if: steps.update_chart.outputs.continue == 'true'
        run: |
          git add helm/kube-depod/Chart.yaml helm/kube-depod/values.yaml manifests/deployment.yaml
          git commit -m "chore(release): bump helm chart to v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create and push new tag
        if: steps.update_chart.outputs.continue == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Creating and pushing tag ${TAG}..."
          git tag "${TAG}"
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
          git push origin "${TAG}"
          echo "Tag ${TAG} pushed successfully."
