name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain-action@stable
        with:
          toolchain: stable

      - name: Run cargo test
        run: cargo test --all-features
