name: Helm Release

on:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Add Helm repos
        run: |
          helm repo add stable https://charts.helm.sh/stable

      - name: Package Helm chart
        run: |
          mkdir -p ./helm/releases
          helm package ./helm/kube-depod -d ./helm/releases

      - name: Update Helm index
        run: |
          if [ -d "gh-pages" ]; then
            helm repo index ./helm/releases --merge gh-pages/index.yaml --url https://mrchypark.github.io/kube-depod
          else
            helm repo index ./helm/releases --url https://mrchypark.github.io/kube-depod
          fi

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Copy packaged chart
        run: |
          cp ./helm/releases/*.tgz gh-pages/ || true
          cp ./helm/releases/index.yaml gh-pages/index.yaml

      - name: Commit and push to gh-pages
        working-directory: ./gh-pages
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Helm chart - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin gh-pages
          fi
