apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.kube-depod.io
spec:
  group: kube-depod.io
  names:
    kind: DepodPolicy
    plural: policies
    shortNames:
      - pol
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - target
                - trigger
                - condition
                - action
                - limits
              properties:
                target:
                  type: object
                  properties:
                    namespace_selector:
                      type: object
                      properties:
                        match_names:
                          type: array
                          items:
                            type: string
                    pod_selector:
                      type: object
                      properties:
                        match_labels:
                          type: object
                          additionalProperties:
                            type: string
                trigger:
                   type: object
                   required:
                     - annotation_key
                     - annotation_values
                   properties:
                     annotation_key:
                       type: string
                       description: Annotation key to look for
                     annotation_values:
                       type: array
                       items:
                         type: string
                       description: Accepted annotation values
                condition:
                   type: object
                   required:
                     - condition_type
                   properties:
                     condition_type:
                       type: string
                       enum: ["Builtin", "CEL"]
                       description: Condition type
                     expression:
                       type: string
                       description: CEL expression (required for CEL type)
                     ttl_seconds:
                       type: integer
                       description: TTL in seconds (required for Builtin type)
                action:
                   type: object
                   required:
                     - action_type
                   properties:
                     action_type:
                       type: string
                       enum: ["Delete", "Evict"]
                       description: Action type
                     grace_period_seconds:
                       type: integer
                       description: Grace period for deletion
                     dry_run:
                       type: boolean
                       default: false
                       description: Dry-run mode (no actual deletion)
                limits:
                   type: object
                   properties:
                     max_deletes_per_minute:
                       type: integer
                       description: Max pods to delete per minute
                     protect_system_namespaces:
                       type: boolean
                       default: true
                       description: Protect system namespaces
      additionalPrinterColumns:
        - jsonPath: .spec.condition.type
          name: Condition Type
          type: string
        - jsonPath: .spec.action.type
          name: Action
          type: string
        - jsonPath: .spec.action.dryRun
          name: Dry Run
          type: boolean
