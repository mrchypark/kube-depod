apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-depod.fullname" . }}-metrics
  labels:
    {{- include "kube-depod.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "kube-depod.selectorLabels" . | nindent 4 }}
