{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-depod.fullname" . }}
  labels:
    {{- include "kube-depod.labels" . | nindent 4 }}
rules:
  # Read Policy CRD
  - apiGroups: ["kube-depod.io"]
    resources: ["depodpolicies"]
    verbs: ["get", "list", "watch"]

  # Patch Policy status
  - apiGroups: ["kube-depod.io"]
    resources: ["depodpolicies/status"]
    verbs: ["patch"]

  # Read/Patch/Delete Pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "delete", "deletecollection"]

  # Create pod eviction subresource (for future use)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

  # Read pod logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Read events for status updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-depod.fullname" . }}
  labels:
    {{- include "kube-depod.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-depod.fullname" . }}
subjects:
   - kind: ServiceAccount
     name: {{ include "kube-depod.serviceAccountName" . }}
     namespace: {{ include "kube-depod.namespace" . | quote }}
{{- end }}
