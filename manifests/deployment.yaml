apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-depod
  namespace: kube-system
  labels:
    app: kube-depod
    version: v0.3.8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-depod
  template:
    metadata:
      labels:
        app: kube-depod
        version: v0.3.8
    spec:
      serviceAccountName: kube-depod
      containers:
      - name: operator
        image: ghcr.io/mrchypark/kube-depod:v0.3.8
        imagePullPolicy: IfNotPresent
        env:
        - name: RUST_LOG
          value: "info"
        - name: OPERATOR_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RESYNC_ENABLE
          value: "true"
        - name: RESYNC_INTERVAL_SECONDS
          value: "3600"
        - name: RATE_LIMIT_PER_MINUTE
          value: "20"
        - name: POD_PATCH_CONCURRENCY_LIMIT
          value: "10"
        - name: SERVER_PORT
          value: "8080"
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534  # nobody user
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      securityContext:
        fsGroup: 65534
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kube-depod
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
