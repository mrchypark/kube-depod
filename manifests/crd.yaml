apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: depodpolicies.kube-depod.io
spec:
  group: kube-depod.io
  names:
    kind: DepodPolicy
    plural: depodpolicies
    shortNames:
      - dpol
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - match
                - trigger
                - when
                - then
                - limits
              properties:
                match:
                  type: object
                  properties:
                    namespaceSelector:
                      type: object
                      properties:
                        matchNames:
                          type: array
                          items:
                            type: string
                    podSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                trigger:
                  type: object
                  required:
                    - annotationKey
                    - annotationValues
                  properties:
                    annotationKey:
                      type: string
                      description: Annotation key to look for
                    annotationValues:
                      type: array
                      items:
                        type: string
                      description: Accepted annotation values
                when:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum: ["Builtin", "CEL"]
                      description: Condition type
                    expression:
                      type: string
                      description: CEL expression (required for CEL type)
                    ttlSeconds:
                      type: integer
                      description: TTL in seconds (required for Builtin type)
                then:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum: ["Delete", "Evict"]
                      description: Action type
                    gracePeriodSeconds:
                      type: integer
                      description: Grace period for deletion/eviction in seconds
                    dryRun:
                      type: boolean
                      default: false
                      description: Dry-run mode (no actual deletion)
                limits:
                  type: object
                  properties:
                    maxDeletesPerMinute:
                      type: integer
                      description: Max pods to delete per minute
                    protectSystemNamespaces:
                      type: boolean
                      default: true
                      description: Protect system namespaces
                    excludedNamespaces:
                      type: array
                      items:
                        type: string
                      description: List of namespaces to exclude from deletion
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                lastObservedTime:
                  type: string
                pods_evaluated:
                  type: integer
                  format: int64
                pods_matched:
                  type: integer
                  format: int64
                pods_deleted:
                  type: integer
                  format: int64
                evaluation_errors:
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - jsonPath: .spec.when.type
          name: Condition Type
          type: string
        - jsonPath: .spec.then.type
          name: Action
          type: string
        - jsonPath: .spec.then.dryRun
          name: Dry Run
          type: boolean
