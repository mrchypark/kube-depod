[package]
name = "kube-depod"
version = "0.1.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
kube = { version = "0.89", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.21", features = ["v1_28"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.8"
axum = "0.7"
hyper = "1"
cel = "0.11"
dashmap = "5.5"

[[bin]]
name = "operator"
path = "src/main.rs"
