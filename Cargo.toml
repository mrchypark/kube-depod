[package]
name = "kube-operator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
kube = { version = "0.89", features = ["runtime", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
futures = "0.3"

[[bin]]
name = "operator"
path = "src/main.rs"
