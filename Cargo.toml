[package]
name = "kube-depod"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
kube = { version = "2.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26", features = ["v1_30"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1.0"
axum = "0.8"
hyper = "1.7"
cel = "0.11"
dashmap = "6.1"
arc-swap = "1.7"

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"

[[bin]]
name = "operator"
path = "src/main.rs"
