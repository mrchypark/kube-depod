# CEL-based Pod cleanup policy examples
# These policies demonstrate various CEL expressions for automated pod deletion
#
# Available CEL Variables:
# - pod: Full Pod object (root variable)
# - metadata: pod.metadata (namespace, name, labels, annotations, etc.)
# - spec: pod.spec (containers, volumes, etc.)
# - status: pod.status (phase, containerStatuses, conditions, etc.)
# - now: Current Unix timestamp (epoch seconds, UTC)
# - age: Seconds since pod creation (creationTimestamp)

---
# Policy 1: Delete Pods with CrashLoopBackOff status
apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: crashloop-pods
  namespace: default
spec:
  match:
    namespaceSelector:
      matchNames:
        - default
    podSelector:
      matchLabels:
        app: worker

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "auto-cleanup"

  when:
    type: "CEL"
    expression: |
      has(status.containerStatuses) &&
      status.containerStatuses.exists(c,
        has(c.state.waiting) &&
        c.state.waiting.reason == 'CrashLoopBackOff' &&
        c.restartCount >= 5
      )

  then:
    type: "Delete"
    gracePeriodSeconds: 0
    dryRun: false

  limits:
    maxDeletesPerMinute: 10
    protectSystemNamespaces: true
    excludedNamespaces:
      - istio-system
      - linkerd

---
# Policy 2: Delete Pods with ImagePullBackOff or ErrImagePull
apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: image-pull-backoff-policy
  namespace: default
spec:
  match:
    namespaceSelector:
      matchNames:
        - default

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "cleanup-image-errors"

  when:
    type: "CEL"
    expression: |
      has(status.containerStatuses) &&
      status.containerStatuses.exists(c,
        has(c.state.waiting) && (
          c.state.waiting.reason == 'ImagePullBackOff' ||
          c.state.waiting.reason == 'ErrImagePull'
        )
      )

  then:
    type: "Delete"
    gracePeriodSeconds: 0
    dryRun: false

  limits:
    maxDeletesPerMinute: 15
    protectSystemNamespaces: true

---
# Policy 3: Delete Pods with too many restarts
apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: high-restart-policy
  namespace: default
spec:
  match:
    namespaceSelector:
      matchNames:
        - default

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "cleanup-flaky"

  when:
    type: "CEL"
    expression: |
      has(status.containerStatuses) &&
      status.containerStatuses.exists(c,
        c.restartCount > 10 && c.ready == false
      )

  then:
    type: "Delete"
    gracePeriodSeconds: 30
    dryRun: false

  limits:
    maxDeletesPerMinute: 8
    protectSystemNamespaces: true

---
# Policy 4: Delete Pods with Succeeded phase (batch jobs)
apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: succeeded-pods-cleanup
  namespace: default
spec:
  match:
    namespaceSelector:
      matchNames:
        - default
    podSelector:
      matchLabels:
        type: batch-job

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "cleanup-batch"

  when:
    type: "CEL"
    expression: |
      has(status) &&
      status.phase == 'Succeeded'

  then:
    type: "Delete"
    gracePeriodSeconds: 0
    dryRun: false

  limits:
    maxDeletesPerMinute: 50
    protectSystemNamespaces: true

---
# Policy 5: Dry-run example - test the expression without deletion
apiVersion: kube-depod.io/v1alpha1
kind: DepodPolicy
metadata:
  name: test-crashloop-dryrun
  namespace: default
spec:
  match:
    namespaceSelector:
      matchNames:
        - default

  trigger:
    annotationKey: "kube-depod/policy"
    annotationValues:
      - "cleanup-dryrun"

  when:
    type: "CEL"
    expression: |
      has(status.containerStatuses) &&
      status.containerStatuses.exists(c,
        has(c.state.waiting) &&
        c.state.waiting.reason == 'CrashLoopBackOff'
      )

  then:
    type: "Delete"
    gracePeriodSeconds: 30
    dryRun: true  # Enable dry-run mode - won't actually delete

  limits:
    maxDeletesPerMinute: 100
    protectSystemNamespaces: true

---
# Example pod for CrashLoopBackOff testing
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-crashloop
  namespace: default
  labels:
    app: worker
  annotations:
    kube-depod/policy: "auto-cleanup"
spec:
  containers:
  - name: app
    image: busybox:latest
    command: ["sh", "-c", "exit 1"]
  restartPolicy: Always

---
# Example pod for batch job testing
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-batch-succeeded
  namespace: default
  labels:
    app: batch-processor
    type: batch-job
  annotations:
    kube-depod/policy: "cleanup-batch"
spec:
  containers:
  - name: job
    image: busybox:latest
    command: ["echo", "Job completed"]
  restartPolicy: Never
